<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upis | Kraljica šah</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-yellow-400 text-gray-900">
    <header class="sticky top-0 bg-black border-b border-gray-200">
      <div
        class="max-w-5xl mx-auto px-4 py-4 flex justify-start gap-4 items-center"
      >
        <a href="index.html" class="text-xl font-bold text-yellow-400"
          >Kraljica šah</a>
          <img src="slike/kraljica.svg"  width="50" height="50" alt="Kraljica šah">

        <nav class="hidden md:flex gap-6">
          <a href="index.html" class="hover:text-yellow-300">Naslovnica</a>
          <a href="usluge.html" class="hover:text-yellow-300">Usluge</a>
          <a href="kontakt.html" class="hover:text-yellow-300">Kontakt</a>
        </nav>
        
      </div>
    </header>
    <nav class="md:hidden bg-white border-b border-gray-500">
      <div class="flex justify-around py-2 text-sm font-bold">
        <a href="index.html" class="hover:text-yellow-700 text-black">Naslovnica</a>
        <a href="usluge.html" class="hover:text-yellow-700 text-black">Usluge</a>
        <a href="kontakt.html" class="hover:text-yellow-700 text-black">Kontakt</a>
      </div>
    </nav>
    <section class="max-w-2xl mx-auto px-4 py-12">
      <h1 class="text-2xl font-bold mb-6">Upis na tečaj</h1>
      <form class="flex flex-col gap-4">
        <div class="flex flex-col md:flex-row gap-4">

          <div class="flex flex-col gap-1 w-full">

            <label for="name" class="text-sm font-medium">Ime i prezime</label>
            <input type="text" id="name" name="name" 
            class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none" />
            

          </div>
          <div class="flex flex-col gap-1 w-full">
            <label for="email" class="text-sm font-medium">E-mail adresa</label>
            <input type="email" id="email" name="email" 
            class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"/>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label for="message" class="text-sm font-medium">Koji tečaj te zanima?</label>
          <textarea id="message" name="message" rows="4" 
          class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"></textarea>
        </div>
        <button type="submit"
        class="bg-black text-white font-semibold px-6 py-3 rounded-lg hover:bg-teal-800"
        >Pošalji prijavu</button>
      </form>
    </section>

    <footer class="bg-gray-800 text-gray-300">
      <div
        class="max-w-5xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between gap-4 text-sm"
      >
        <p>Kraljica šah, Trg kraljeva 1, Koprivnica</p>
        <p>Radnim danom 16-19, subotom 9-12</p>
      </div>
    </footer>
  </body>
</html>
